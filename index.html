<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AdPulse</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .banner {
      background: #e74c3c;
      padding: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #f1c40f;
    }

    .info {
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
    }

    .earn-btn {
      background: #27ae60;
      color: #fff;
    }
    .earn-btn:hover:not(:disabled) {
      background: #2ecc71;
    }

    .video-btn {
      background: #e67e22;
      color: #fff;
    }
    .video-btn:hover {
      background: #f39c12;
    }

    .timer {
      margin-top: 10px;
      font-size: 14px;
      color: #bdc3c7;
    }

    .notice {
      margin-top: 20px;
      font-size: 16px;
      color: #f1c40f;
      display: none;
    }
  </style>
</head>
<body>
  <div class="banner">NO VPN | MOBILE DATA RECOMMENDED | NO MULTIPLE ACCOUNTS</div>
  <div class="card">
    <h1>AdPulse Premium</h1>
    <div class="info">Tasks Left: <span id="tasks">20</span></div>
    <button id="earnBtn" class="earn-btn">WATCH AD & EARN</button>
    <div class="timer" id="timer"></div>
    <button id="videoBtn" class="video-btn">WATCH VIDEO</button>
    <div class="notice" id="notice">⚠️ This section is UNDER CONSTRUCTION. Please return later!</div>
  </div>

  <script>
    const earnBtn = document.getElementById('earnBtn');
    const timerDisplay = document.getElementById('timer');
    const tasks = document.getElementById('tasks');
    const videoBtn = document.getElementById('videoBtn');
    const notice = document.getElementById('notice');

    let cooldown = false;

    earnBtn.addEventListener('click', () => {
      if (!cooldown) {
        let remaining = parseInt(tasks.textContent);
        if (remaining > 0) {
          tasks.textContent = remaining - 1;
        }
        cooldown = true;
        earnBtn.disabled = true;
        let timeLeft = 180; // 3 minutes in seconds
        timerDisplay.textContent = `Next task available in ${timeLeft}s`;

        const interval = setInterval(() => {
          timeLeft--;
          timerDisplay.textContent = `Next task available in ${timeLeft}s`;
          if (timeLeft <= 0) {
            clearInterval(interval);
            cooldown = false;
            earnBtn.disabled = false;
            timerDisplay.textContent = '';
          }
        }, 1000);
      }
    });

    videoBtn.addEventListener('click', () => {
      notice.style.display = 'block';
    });
  </script>
</body>
</html>
