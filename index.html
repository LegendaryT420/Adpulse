<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdPulse</title>

<style>
:root {
    --neon-cyan:#00f3ff;
    --neon-pink:#ff0077;
}

body {
    margin:0;
    font-family:sans-serif;
    color:white;
    overflow-x:hidden;
    background: radial-gradient(circle at 30% 30%, #00f3ff22, transparent),
                radial-gradient(circle at 70% 70%, #ff007722, transparent),
                #05070f;
    min-height: 100vh;
}

/* GEMINI STYLE MOVING LIGHT */
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(120deg,#00f3ff33,#8a2eff33,#ff007733);
    filter:blur(80px);
    animation:move 12s infinite linear;
    z-index:-1;
}
@keyframes move {
    0%{transform:translateX(-20%)}
    100%{transform:translateX(20%)}
}

.notice {
    text-align:center;
    background:#990000;
    padding:12px;
    font-weight:bold;
    font-size: 13px;
}

.card {
    margin:60px auto 20px auto;
    width:320px;
    padding:25px;
    border-radius:20px;
    background:rgba(20,20,40,0.6);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    text-align:center;
    box-shadow:0 0 30px #00f3ff55;
    border: 1px solid rgba(0, 243, 255, 0.2);
    position: relative;
    z-index: 10;
}

.balance { color:var(--neon-cyan); text-shadow:0 0 10px var(--neon-cyan); font-weight: bold; }

.btn {
    width:100%;
    padding:18px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    font-size: 16px;
    cursor:pointer;
    transition: 0.3s;
    text-transform: uppercase;
}

.btn-main { background:linear-gradient(135deg,#00f3ff,#008cff); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
.btn-claim { background:linear-gradient(135deg,#3fb950,#00ff55); box-shadow: 0 0 20px rgba(63, 185, 80, 0.6); }

.btn:disabled { background: #333 !important; color: #777; cursor: not-allowed; box-shadow: none; }

#statusText { margin-top: 15px; font-weight: bold; min-height: 20px; }
.timer-red { color: var(--neon-pink); }
.verify-blue { color: var(--neon-cyan); }

.watermark {
    text-align:center;
    font-size: 60px;
    font-weight: 900;
    opacity: 0.15;
    margin-top: 20px;
    text-transform: uppercase;
    color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan);
    pointer-events: none;
}
</style>
</head>

<body>

<div class="notice">
NO VPN | MOBILE DATA RECOMMENDED | NO MULTIPLE ACCOUNTS
</div>

<div class="card">
<h2>AdPulse</h2>

<div style="font-size: 14px; margin-bottom: 20px;">
Tasks: <span id="taskCount" style="color:var(--neon-cyan);">0</span> | 
Balance: <span class="balance" id="balance">$0.00</span>
</div>

<button id="adBtn" class="btn btn-main" onclick="openAd()">WATCH AD</button>

<button id="claimBtn" class="btn btn-claim" onclick="claimReward()" style="display:none;">CLAIM REWARD</button>

<p id="statusText"></p>

<h3 style="margin-top:30px; opacity:0.7;">Video Tasks</h3>
<button class="btn btn-video" style="background:linear-gradient(135deg,#ff7700,#ff0077);" onclick="alert('Opens May 17th!')">WATCH VIDEO</button>
</div>

<div class="watermark">AdPulse</div>

<script>
const AD_URL = https://gemini.google.com/; 
const REWARD = 0.10; 
const VERIFY_TIME = 10; // Seconds they MUST wait to ensure impression
const COOLDOWN_TIME = 300; // 5 minutes lockout

const isWifi = navigator.connection && navigator.connection.type === "wifi";
const LIMIT = isWifi ? 10 : 20;

let balance = parseFloat(localStorage.getItem("balance") || 0);
let used = parseInt(localStorage.getItem("used") || 0);

function updateUI(){
    document.getElementById("taskCount").innerText = Math.max(0, LIMIT - used);
    document.getElementById("balance").innerText = "$" + balance.toFixed(2);
    
    // Check if user is currently in an 8-minute cooldown
    let lastClaim = parseInt(localStorage.getItem("lastClaim") || 0);
    let diff = (Date.now() - lastClaim) / 1000;
    
    if (diff < COOLDOWN_TIME && used > 0) {
        startCooldownTimer(Math.ceil(COOLDOWN_TIME - diff));
    }
}

function openAd(){
    if(used >= LIMIT) return alert("Daily limit reached!");

    window.open(https://gemini.google.com/, "_blank");
    
    // Hide Watch button, show countdown
    document.getElementById("adBtn").style.display = "none";
    let status = document.getElementById("statusText");
    status.className = "verify-blue";
    
    let timeLeft = VERIFY_TIME;
    let verifyInterval = setInterval(() => {
        status.innerText = "Verifying View: " + timeLeft + "s...";
        timeLeft--;
        
        if(timeLeft < 0) {
            clearInterval(verifyInterval);
            status.innerText = "View Verified!";
            document.getElementById("claimBtn").style.display = "block";
        }
    }, 1000);
}

function claimReward(){
    balance += REWARD;
    used++;
    
    localStorage.setItem("balance", balance);
    localStorage.setItem("used", used);
    localStorage.setItem("lastClaim", Date.now());

    document.getElementById("claimBtn").style.display = "none";
    document.getElementById("adBtn").style.display = "block";
    
    updateUI();
}

function startCooldownTimer(seconds) {
    let btn = document.getElementById("adBtn");
    let status = document.getElementById("statusText");
    btn.disabled = true;
    status.className = "timer-red";

    let interval = setInterval(() => {
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;
        status.innerText = "Next Task: " + m + ":" + (s < 10 ? "0" : "") + s;
        seconds--;

        if(seconds < 0) {
            clearInterval(interval);
            btn.disabled = false;
            status.innerText = "Ready!";
        }
    }, 1000);
}

window.onload = updateUI;
</script>

</body>
</html>
