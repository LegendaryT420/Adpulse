<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdPulse Control Center</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adgrams.org/sdk/adgrams-sdk.js"></script>

<style>
/* ========================================
   CONTROL ROOM (STYLE)
   ========================================
*/
:root {
    --neon-cyan: #00f3ff;
    --neon-pink: #ff0077;
    --bg-dark: #05070f;
}

body {
    margin:0; font-family: sans-serif; color: white; overflow-x: hidden;
    background: radial-gradient(circle at 30% 30%, #00f3ff22, transparent),
                radial-gradient(circle at 70% 70%, #ff007722, transparent),
                var(--bg-dark);
    min-height: 100vh;
}

body::before {
    content:""; position:fixed; inset:0;
    background:linear-gradient(120deg,#00f3ff33,#8a2eff33,#ff007733);
    filter:blur(80px); animation:move 12s infinite linear; z-index:-1;
}
@keyframes move { 0%{transform:translateX(-20%)} 100%{transform:translateX(20%)} }

.notice {
    text-align:center; background:#990000; padding:12px; font-weight:bold; font-size: 13px;
    animation: blink-bg 1.5s step-start infinite;
}
@keyframes blink-bg { 50% { opacity: 0.7; background: #ff0000; } }

.card {
    margin:60px auto 20px auto; width:320px; padding:25px; border-radius:20px;
    background:rgba(20,20,40,0.6); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px); text-align:center;
    box-shadow:0 0 30px #00f3ff55; border: 1px solid rgba(0, 243, 255, 0.2);
    position: relative; z-index: 10;
}

.btn {
    width:100%; padding:18px; margin-top:15px; border:none; border-radius:12px;
    font-weight:bold; font-size: 16px; cursor:pointer; transition: 0.3s; text-transform: uppercase;
}
.btn-main { background:linear-gradient(135deg,#00f3ff,#008cff); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
.btn-video { background:linear-gradient(135deg,#ff7700,#ff0077); box-shadow: 0 0 15px rgba(255, 0, 119, 0.3); }
.btn:disabled { background: #333 !important; color: #777; cursor: not-allowed; box-shadow: none; }

/* CUSTOM MODAL OVERLAY (The "Blank Page" Prompt) */
#customOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
    z-index: 2000; align-items: center; justify-content: center; flex-direction: column;
    backdrop-filter: blur(15px);
}
.modal-content {
    text-align: center; padding: 40px; border: 2px solid var(--neon-pink);
    border-radius: 30px; background: #0a0c16; box-shadow: 0 0 50px var(--neon-pink);
}

.watermark {
    text-align:center; font-size: 60px; font-weight: 900; opacity: 0.12;
    margin-top: 20px; text-transform: uppercase; color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan); pointer-events: none; letter-spacing: 4px;
}
</style>
</head>

<body>

<div class="notice" id="topNotice">---</div>

<div id="customOverlay">
    <div class="modal-content">
        <h1 style="color:var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink);">STAY TUNED</h1>
        <p style="font-weight:bold; letter-spacing:1px;">This section is unlocking</p>
        <h2 style="color:var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);">SOON!!</h2>
        <button class="btn btn-main" style="width:auto; padding: 10px 40px;" onclick="closeModal()">BACK</button>
    </div>
</div>

<div class="card">
    <h2 id="displayBrandName">---</h2>
    <div style="font-size: 14px; margin-bottom: 20px;">
        Tasks Remaining: <span id="taskCount" style="color:var(--neon-cyan);">0</span>
    </div>

    <button id="adBtn" class="btn btn-main" onclick="showAdgramsAd()">WATCH AD</button>
    <p id="statusText" style="margin-top:15px; font-weight:bold; min-height:20px;"></p>

    <h3 style="margin-top:30px; opacity:0.7;">Video Tasks</h3>
    <button class="btn btn-video" onclick="openModal()">WATCH VIDEO</button>
</div>

<div class="watermark" id="displayWatermark">---</div>

<script>
/* ========================================
   MASTER CONTROL ROOM (EDIT HERE)
   ========================================
*/
const CONFIG = {
    BRAND_NAME:    "AdPulse",          
    ADGRAMS_ID:    "YOUR_ADGRAMS_BLOCK_ID", 
    REWARD_AMOUNT: 0.10,               
    COOLDOWN_SEC:  300,                
    DAILY_LIMIT:   20,                 
    NOTICE_TEXT:   "NO VPN | MOBILE DATA RECOMMENDED | NO MULTIPLE ACCOUNTS"
};

/* ========================================
   SYSTEM ENGINE
   ========================================
*/
const tg = window.Telegram.WebApp;
tg.expand();

document.title = CONFIG.BRAND_NAME;
document.getElementById("displayBrandName").innerText = CONFIG.BRAND_NAME + "_NEON";
document.getElementById("displayWatermark").innerText = CONFIG.BRAND_NAME;
document.getElementById("topNotice").innerText = CONFIG.NOTICE_TEXT;

let used = parseInt(localStorage.getItem("used") || 0);

function updateUI(){
    document.getElementById("taskCount").innerText = Math.max(0, CONFIG.DAILY_LIMIT - used);
    let lastClaim = parseInt(localStorage.getItem("lastClaim") || 0);
    let diff = (Date.now() - lastClaim) / 1000;
    
    if (diff < CONFIG.COOLDOWN_SEC && used > 0) {
        startCooldownTimer(Math.ceil(CONFIG.COOLDOWN_SEC - diff));
    }
}

function showAdgramsAd() {
    if(used >= CONFIG.DAILY_LIMIT) return alert("Daily limit reached!");

    window.Adgrams.showAd(CONFIG.ADGRAMS_ID)
        .then((result) => {
            if (result.completed) {
                used++;
                localStorage.setItem("used", used);
                localStorage.setItem("lastClaim", Date.now());
                
                const rewardData = {
                    status: "success",
                    reward: CONFIG.REWARD_AMOUNT,
                    task_type: "adgrams_view"
                };
                tg.sendData(JSON.stringify(rewardData)); 
                updateUI();
            }
        })
        .catch((err) => {
            console.log("Adgrams error");
        });
}

function startCooldownTimer(seconds) {
    let btn = document.getElementById("adBtn");
    let status = document.getElementById("statusText");
    btn.disabled = true;
    status.style.color = "var(--neon-pink)";

    let interval = setInterval(() => {
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;
        status.innerText = "Next Task: " + m + ":" + (s < 10 ? "0" : "") + s;
        seconds--;
        if(seconds < 0) {
            clearInterval(interval);
            btn.disabled = false;
            status.innerText = "Ready!";
        }
    }, 1000);
}

// Modal Functions
function openModal() { document.getElementById("customOverlay").style.display = "flex"; }
function closeModal() { document.getElementById("customOverlay").style.display = "none"; }

window.onload = updateUI;
</script>
</body>
</html>
