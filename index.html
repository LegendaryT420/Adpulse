<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdPulse Neon Edition</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='10932641' data-sdk='show_10932641'></script>

<style>
:root {
    --neon-cyan:#00f3ff;
    --neon-pink:#ff0077;
    --bg-dark:#05070f;
}

body {
    margin:0;
    font-family:Segoe UI;
    color:white;
    overflow-x:hidden;
    background:radial-gradient(circle at 30% 30%,#00f3ff22,transparent),
               radial-gradient(circle at 70% 70%,#ff007722,transparent),
               var(--bg-dark);
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(120deg,#00f3ff33,#8a2eff33,#ff007733);
    filter:blur(80px);
    animation:move 12s linear infinite;
    z-index:-1;
}

@keyframes move{
    0%{transform:translateX(-20%)}
    100%{transform:translateX(20%)}
}

.notice{
    text-align:center;
    background:#990000;
    padding:14px;
    font-weight:bold;
    font-size:13px;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{opacity:0.6;background:#ff0000;}
}

.card{
    margin:60px auto;
    width:320px;
    padding:30px;
    border-radius:25px;
    background:rgba(20,20,40,0.7);
    backdrop-filter:blur(20px);
    text-align:center;
    box-shadow:0 0 40px #00f3ff55;
}

.btn{
    width:100%;
    padding:18px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-main{
    background:linear-gradient(135deg,#00f3ff,#008cff);
    color:black;
}

.btn-video{
    background:linear-gradient(135deg,#ff7700,#ff0077);
    color:white;
}

.btn:disabled{
    background:#222;
    color:#555;
}

.watermark{
    text-align:center;
    font-size:60px;
    opacity:0.1;
    margin-top:40px;
}
</style>
</head>

<body>

<div class="notice">NO VPN | MOBILE DATA RECOMMENDED</div>

<div class="card">
    <h2 id="brand">AdPulse_NEON</h2>

    <p>Coins: <span id="coins">0</span></p>
    <p>Tasks Left: <span id="tasks">5</span></p>

    <button class="btn btn-main" id="taskBtn" onclick="startTask()">START TASK</button>

    <p id="status"></p>

    <button class="btn btn-video" onclick="openVideo()">WATCH VIDEO TASK</button>
</div>

<div class="watermark">AdPulse</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let coins = parseInt(localStorage.getItem("coins") || 0);
let tasks = parseInt(localStorage.getItem("tasks") || 5);
let last = 0;

function updateUI(){
    document.getElementById("coins").innerText = coins;
    document.getElementById("tasks").innerText = tasks;
}
updateUI();

/* =========================
   TASK SYSTEM (CORE)
========================= */
function startTask(){
    if(tasks <= 0){
        alert("No tasks left today");
        return;
    }

    let btn = document.getElementById("taskBtn");
    btn.disabled = true;

    document.getElementById("status").innerText = "Preparing reward...";

    // anti-spam delay
    setTimeout(() => {
        let viewed = false;


        showAd();

    }, 3000);
}

/* =========================
   MONETAG AD SYSTEM
========================= */
function showAd(){

    if(typeof show_10932641 !== "function"){
        alert("Ad not ready");
        return;
    }

    let startTime = Date.now();   // 👈 START tracking BEFORE ad

    show_10932641();              // 👈 Monetag ad trigger

    setTimeout(() => {

        let watchedTime = Date.now() - startTime;

        // 🔥 REWARD SYSTEM GOES HERE
        if(watchedTime > 4000){

            coins += 10;
            tasks -= 1;

            localStorage.setItem("coins", coins);
            localStorage.setItem("tasks", tasks);

            if(window.Telegram?.WebApp?.sendData){
                Telegram.WebApp.sendData(JSON.stringify({
                    coins: coins
                }));
            }

            document.getElementById("status").innerText = "Reward +10 coins";
            updateUI();

        } else {
            alert("Ad not properly viewed");
        }

    }, 6000); // wait window (important for Monetag)

}
        document.getElementById("status").innerText = "Reward Earned +10 coins";
        document.getElementById("taskBtn").disabled = false;

        updateUI();

    }, 5000); // fake completion window

}

/* =========================
   VIDEO TASK (extra engagement)
========================= */
function openVideo(){
    alert("Video task coming soon");
}

/* =========================
   DAILY RESET SYSTEM
========================= */
let today = new Date().toDateString();
let saved = localStorage.getItem("day");

if(saved !== today){
    localStorage.setItem("day", today);
    localStorage.setItem("tasks", 5);
}
</script>

</body>
</html>
